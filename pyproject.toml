[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharos-sdk"
dynamic = ["version"]
description = "Official Python SDK for Pharos Connect."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pharos", email = "contacto@pharos.pe" }]
keywords = ["pharos", "aduanas", "customs", "peru", "dua", "sunat", "webhooks"]
dependencies = [
    "httpx>=0.27",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://pharos.pe/desarrolladores/"
Repository = "https://github.com/pharos-pe/pharos-python-sdk"
Changelog = "https://github.com/pharos-pe/pharos-python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["mypy>=1.11,<1.15", "pytest>=8.0,<9", "pytest-cov>=5.0,<6", "ruff>=0.6"]

# Single source of truth for the version: pharos_sdk/version.py. The tag, the
# metadata and __version__ cannot drift apart.
[tool.hatch.version]
path = "pharos_sdk/version.py"

[tool.hatch.build.targets.wheel]
packages = ["pharos_sdk"]

[tool.pytest.ini_options]
addopts = "--cov=pharos_sdk --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.mypy]
python_version = "3.8"
strict = true
packages = ["pharos_sdk"]
ignore_missing_imports = true
