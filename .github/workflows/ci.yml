name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-24.04]
        include:
          # setup-python no longer publishes a 3.8 build for 24.04. We still
          # support 3.8 because the ERPs this SDK talks to are not always on a
          # current runtime, so it is tested on 22.04.
          - python-version: '3.8'
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --no-site-packages pharos_sdk
      - name: Pytest
        run: pytest

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches the package version
        run: |
          # Anchored to the assignment: an unanchored quoted-string match reads
          # the module docstring instead, which is what it did the first time
          # this guard ever ran.
          version="$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("pharos_sdk/version.py").read_text()
          print(re.search(r'^__version__\s*=\s*"([^"]+)"', text, re.M).group(1))
          PY
          )"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.py ($version)." >&2
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
